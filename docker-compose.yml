services:
  db:
    image: postgres:16
    container_name: simplifootball-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simplifootball
    ports:
      - "5432:5432"
    volumes:
      - simplifootball_pgdata:/var/lib/postgresql/data

volumes:
  simplifootball_pgdata: